<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nicholas Womack — Senior Product Designer</title>
<meta name="description" content="Nicholas Womack, Senior Product Designer. Selected work from JPMorgan Chase and Vertafore.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --c-ink:      #000000;
  --c-label:    #9E9E9E;
  --c-white:    #FFFFFF;
  --c-link:     #12459B;

  --f: 'Archivo', system-ui, sans-serif;

  --t-name:  clamp(1.375rem, 1.94vw, 1.875rem);   /* 30px */
  --t-role:  clamp(1.0625rem, 1.55vw, 1.5rem);    /* 24px */
  --t-state: clamp(2rem, 3.61vw, 3.5rem);         /* 56px */
  --t-label: clamp(.75rem, 1.03vw, 1rem);         /* 16px */
  --t-title: clamp(1.125rem, 1.55vw, 1.5rem);     /* 24px */

  --l-max:   1240px;
  --l-pad:   clamp(20px, 6.45vw, 100px);

  --card-r:  32px;
  --card-px: clamp(14px, 1.68vw, 26px);
  --card-py: clamp(26px, 3.61vw, 56px);
  --gap-row: clamp(32px, 7.1vw, 110px);
  --gap-sec: clamp(32px, 3.03vw, 47px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  min-height:100vh;
  font-family:var(--f);
  color:var(--c-ink);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;

  /* fallback for browsers without oklab gradient support */
  background:
    radial-gradient(ellipse 56.5% 53.7% at 50% 42%,
      rgb(33,253,225) 0%, rgb(212,254,248) 15.47%, #FFFFFF 100%)
    no-repeat #FFFFFF;
}
@supports (background: radial-gradient(ellipse at 50% 50% in oklab, red, blue)){
  body{
    background:
      radial-gradient(ellipse 56.495% 53.665% at 50% 42% in oklab,
        oklab(89.2% -0.157 -0.003) 0%, 15.47%, oklab(100% 0 0) 100%)
      no-repeat #FFFFFF;
  }
}

.page{
  max-width:var(--l-max);
  margin:0 auto;
  padding:clamp(24px,3vw,40px) var(--l-pad) clamp(48px,5vw,72px);
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:var(--gap-sec);
}

/* ---------- masthead ---------- */
.masthead{
  display:flex;
  align-items:baseline;
  flex-wrap:wrap;
  gap:0 .6em;
  min-height:clamp(48px,5.8vw,84px);
  padding-top:clamp(8px,1.1vw,16px);
}
.masthead .name{font-weight:600;font-size:var(--t-name);line-height:1.2;letter-spacing:-.012em;margin:0}
.masthead .role{font-weight:400;font-size:var(--t-role);line-height:1.25;margin:0}
.masthead .sep{font-weight:400;font-size:var(--t-role);color:var(--c-ink);opacity:.5}

/* ---------- statement ---------- */
.statement{margin:0;font-size:var(--t-state);line-height:1.14;letter-spacing:-.022em;max-width:20ch}
.statement .a{font-weight:400;display:block}
.statement .b{font-weight:300;font-style:italic;display:block}

/* ---------- work ---------- */
.grid{
  width:100%;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:var(--gap-row);
  margin-top:clamp(16px,2.5vw,36px);
}
.card{
  display:flex;
  flex-direction:column;
  gap:24px;
  text-decoration:none;
  color:inherit;
}
.card:focus-visible{outline:2px solid var(--c-link);outline-offset:10px;border-radius:var(--card-r)}


.frame{
  background:var(--c-white);
  border-radius:var(--card-r);
  padding:var(--card-py) var(--card-px);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
/* one shared slot so both thumbnails read at the same size */
.frame img{
  width:100%;
  aspect-ratio:2432/1469;
  object-fit:contain;
  display:block;
  transition:transform 420ms cubic-bezier(.16,.84,.44,1);
}
@media (prefers-reduced-motion:no-preference){
  .card:hover .frame img,
  .card:focus-visible .frame img{transform:scale(1.035)}
}

.meta{display:flex;flex-direction:column;gap:8px;max-width:36ch}
.meta .client{
  margin:0;
  font-weight:500;
  font-size:var(--t-label);
  line-height:1.25;
  letter-spacing:.01em;
  text-transform:uppercase;
  color:var(--c-label);
}
.meta .title{
  margin:0;
  font-weight:600;
  letter-spacing:-.01em;
  font-size:var(--t-title);
  line-height:1.25;
}
.card:hover .title{text-decoration:underline;text-underline-offset:5px}

/* ---------- contact ---------- */
.contact{
  display:flex;
  flex-wrap:wrap;
  gap:6px 24px;
  margin-top:clamp(24px,3vw,44px);
  font-weight:400;
  font-size:var(--t-label);
  color:var(--c-ink);
}
.contact a{color:var(--c-ink);text-decoration:none;border-bottom:1px solid rgba(0,0,0,.25)}
.contact a:hover{border-bottom-color:currentColor}

@media (max-width:820px){
  .grid{grid-template-columns:1fr;gap:clamp(36px,7vw,56px)}
  .statement{max-width:none}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<div class="page">

  <header class="masthead">
    <p class="name">Nicholas Womack</p>
    <span class="sep">·</span>
    <p class="role">Senior Product Designer</p>
  </header>

  <h1 class="statement">
    <span class="a">Designing scalable ecosystems.</span>
    <span class="b">Delivering clean user experiences.</span>
  </h1>

  <main class="grid">

    <a class="card" href="chase/">
      <div class="frame">
        <img src="images/thumb-chase.png" width="2432" height="1469"
             alt="Sales Activity: a chronological table of card sales, refunds and disputes.">
      </div>
      <div class="meta">
        <p class="client">JP Morgan Chase &middot; Payment Solutions</p>
        <p class="title">Redesigning Sales Activity</p>
      </div>
    </a>

    <a class="card" href="riskmatch/">
      <div class="frame">
        <img src="images/thumb-riskmatch.png" width="2432" height="1469"
             alt="The Benefits Benchmarking report: rows of range charts with a median pill and a client marker.">
      </div>
      <div class="meta">
        <p class="client">Vertafore &middot; RiskMatch</p>
        <p class="title">Making Room for the Middle</p>
      </div>
    </a>

  </main>

  <p class="contact">
    <a href="mailto:nicholasromone@gmail.com">nicholasromone@gmail.com</a>
    <span>New York, NY</span>
  </p>

</div>
</body>
</html>
