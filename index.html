<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nicholas Womack — Senior Product Designer</title>
<meta name="description" content="Nicholas Womack, Senior Product Designer. Selected work from JPMorgan Chase and Vertafore.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --c-ink:#0E1419; --c-mid:#5A6672; --c-soft:#8B96A1;
  --c-rule:#D6DEE5; --c-card:#F1F4F7; --c-shot-b:#CFCFCF;
  --c-link:#12459B; --c-white:#FFFFFF;

  --f-display:'Archivo',system-ui,sans-serif;
  --f-body:'Open Sans',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,monospace;

  --t-name:clamp(2.5rem,5.2vw,4.6rem);
  --t-role:clamp(.9375rem,1.25vw,1.125rem);
  --t-card:clamp(1.25rem,1.94vw,1.75rem);
  --t-mono:clamp(.625rem,.76vw,.6875rem);

  --ls-name:-.025em; --ls-h2:-.017em; --ls-mono:.13em;

  --l-page:1440px; --l-max:1240px;
  --l-pad:clamp(20px,2.22vw,32px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--c-white);color:var(--c-ink);
  font-family:var(--f-body);line-height:1.72;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;min-height:100vh;
}
.page{max-width:var(--l-page);margin:0 auto;width:100%;flex:1 0 auto;overflow-x:clip}
.inner{max-width:var(--l-max);margin:0 auto;padding:0 var(--l-pad)}

.mono{
  font-family:var(--f-mono);font-size:var(--t-mono);
  letter-spacing:var(--ls-mono);text-transform:uppercase;
  font-weight:500;color:var(--c-soft);margin:0;line-height:1.72;
}

/* ---------- MASTHEAD ---------- */
.masthead{padding:clamp(56px,8.5vw,128px) 0 clamp(36px,4.5vw,64px)}
h1{
  font-family:var(--f-display);font-weight:700;
  font-size:var(--t-name);line-height:.97;
  letter-spacing:var(--ls-name);margin:0;
}
.role{
  font-family:var(--f-mono);font-size:var(--t-role);
  letter-spacing:.06em;text-transform:uppercase;
  color:var(--c-mid);margin:clamp(14px,1.6vw,22px) 0 0;
}

/* ---------- WORK ---------- */
.work{
  border-top:1px solid var(--c-ink);
  padding:clamp(28px,3.6vw,52px) 0 clamp(56px,7vw,104px);
}
.grid{
  display:grid;grid-template-columns:repeat(2,1fr);
  gap:clamp(28px,3.6vw,52px);
}
.card{display:flex;flex-direction:column;text-decoration:none;color:inherit}
.card:focus-visible{outline:2px solid var(--c-link);outline-offset:8px}

.thumb{
  width:100%;aspect-ratio:16/10;
  background:var(--c-card);
  border:1px solid var(--c-shot-b);
  border-radius:16px;overflow:hidden;
}
.thumb img{
  width:100%;height:100%;object-fit:cover;display:block;
  transition:transform 420ms cubic-bezier(.16,.84,.44,1);
}
@media (prefers-reduced-motion:no-preference){
  .card:hover .thumb img,
  .card:focus-visible .thumb img{transform:scale(1.03)}
}

.card .client{margin-top:22px}
.card h2{
  font-family:var(--f-display);font-weight:700;
  font-size:var(--t-card);line-height:1.14;
  letter-spacing:var(--ls-h2);margin:8px 0 0;
}
.card:hover h2{text-decoration:underline;text-underline-offset:4px}

/* ---------- FOOTER ---------- */
footer{
  flex:0 0 auto;border-top:1px solid var(--c-ink);
  padding:30px 0 44px;max-width:var(--l-page);
  margin:0 auto;width:100%;
}
.foot{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 28px}
.foot .mono{color:var(--c-mid)}
.foot a{color:var(--c-link);text-decoration:none}
.foot a:hover{text-decoration:underline}

@media (max-width:760px){
  .grid{grid-template-columns:1fr;gap:clamp(32px,7vw,44px)}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<div class="page">

  <header class="masthead">
    <div class="inner">
      <h1>Nicholas Womack</h1>
      <p class="role">Senior Product Designer</p>
    </div>
  </header>

  <main class="work">
    <div class="inner">
      <div class="grid">

        <a class="card" href="chase/">
          <div class="thumb">
            <img src="chase/images/01-hero.png" width="1115" height="673"
                 alt="Sales Activity: a chronological table of card sales, refunds and disputes.">
          </div>
          <p class="mono client">JPMorgan Chase &middot; Chase Payment Solutions</p>
          <h2>Redesigning Sales Activity</h2>
        </a>

        <a class="card" href="riskmatch/">
          <div class="thumb">
            <img src="riskmatch/images/01-hero.png" width="2432" height="1470"
                 alt="The Benefits Benchmarking report: rows of range charts with a median pill and a client marker.">
          </div>
          <p class="mono client">Vertafore &middot; RiskMatch</p>
          <h2>Making Room for the Middle</h2>
        </a>

      </div>
    </div>
  </main>

</div>

<footer>
  <div class="inner">
    <div class="foot">
      <span class="mono"><a href="mailto:nicholasromone@gmail.com">nicholasromone@gmail.com</a></span>
      <span class="mono">New York, NY</span>
    </div>
  </div>
</footer>

</body>
</html>
